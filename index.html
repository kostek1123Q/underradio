<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UNDERRADIO</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="bg"></div>

<header>
  <h1>UNDERRADIO</h1>
  <p>Najświeższe i najbardziej niszowe underowe tracki w Polsce</p>

<section class="panel">

  <input id="nick" placeholder="twój nick">
  <input id="url" placeholder="spotify / soundcloud / youtube link">
  <input id="tags" placeholder="#trap #jerk #underground (opcjonalne)">

  <button onclick="addTrack()">DODAJ</button>

</section>

<section class="list">

  <h2>TRACKI</h2>

  <button class="smallBtn" onclick="location.reload()">
    reset filtrów
  </button>

  <div id="tracks"></div>

</section>

<script src="app.js"></script>

</body>
</html>
